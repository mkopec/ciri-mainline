# Ciri (MT8188 SOF): the Pro Audio profile probes every AFE PCM, including
# DMAs owned by SOF and front ends that cannot share SOF's nonatomic back
# ends, which floods dmesg with ASoC -EINVAL errors. HiFi UCM is unaffected.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
]
