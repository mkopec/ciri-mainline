# Google Ciri: MT8188 + MAX98390 + RT5682S, SOF topology.
#
# Endpoints: Speaker (16), Headphones (17), InternalMic (18), Mic (19),
# and DisplayPort (5). Experimental: needs the matching mtk_dp.c changes
# that allow PCM 5 to open with no connected display and report DP Jack HPD.
#
# Two things drive the unusual shape of this file.
#
# 1. PipeWire's ACP probes a verb by setting the verb and then opening every
#    declared PCM. Device EnableSequences have NOT run at that point, and on
#    MT8188 a SOF PCM whose AFE route is not yet connected fails to open
#    (mt8188_sof_be_hw_params() finds the AFE still runtime-suspended, -EINVAL).
#    The analog routes are therefore connected in SectionVerb.EnableSequence so
#    they are live during probing, and the per-device sequences below then
#    toggle them for actual port switching.
#
# 2. ACP also probes PCM 5 at startup, without first running its per-device
#    EnableSequence. Keep its route connected for probing, then use the DP Jack
#    control to report availability when the display is plugged or unplugged.
#
# Jack detection uses JackControl, not the JackDev/JackSwitch pair from the
# ChromeOS UCM: those are CRAS-only extensions that ACP does not parse. The
# control names come from nau8825_jack_pins in mt8188-mt6359.c, which
# mt8188_headset_codec_init() uses for the RT5682S headset link. ALSA appends
# " Jack" only when absent (jack_kctl_name_gen() in sound/core/ctljack.c), so
# pin "Headphone Jack" stays as-is while pin "Headset Mic" becomes
# "Headset Mic Jack".

SectionVerb {
	Value.TQ "HiFi"
	EnableSequence [
		cdev "hw:${CardId}"

		cset "name='ETDM_IN1_Clock_Source' a1sys_a2sys"
		cset "name='ETDM_OUT1_Clock_Source' a1sys_a2sys"
		cset "name='ETDM_IN2_Clock_Source' a1sys_a2sys"
		cset "name='ETDM_OUT2_Clock_Source' a1sys_a2sys"
		cset "name='ETDM_OUT3_Clock_Source' a1sys_a2sys"

		cset "name='UL_SRC_MUX' DMIC"
		cset "name='UL2_SRC_MUX' DMIC"
		cset "name='DMIC0_MUX' DMIC_DATA0"
		cset "name='DMIC2_MUX' DMIC_DATA1_L"
		cset "name='MTKAIF_DMIC Switch' On"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH2"

		cset "name='Front Left DAI Sel Mux' Left"
		cset "name='Front Right DAI Sel Mux' Right"
		cset "name='DAC1 Playback Volume' 120"
		cset "name='STO1 ADC Capture Volume' 50"

		# Connect every analog route before ACP probes the PCMs.
		cset "name='O072 I070 Switch' 1"
		cset "name='O073 I071 Switch' 1"
		cset "name='O048 I020 Switch' 1"
		cset "name='O049 I021 Switch' 1"
		cset "name='O034 I168 Switch' 1"
		cset "name='O035 I169 Switch' 1"
		cset "name='O036 I012 Switch' 1"
		cset "name='O037 I013 Switch' 1"
		cset "name='DPTX_OUT_MUX' 1"
	]
	DisableSequence [
		cdev "hw:${CardId}"

		cset "name='O072 I070 Switch' 0"
		cset "name='O073 I071 Switch' 0"
		cset "name='O048 I020 Switch' 0"
		cset "name='O049 I021 Switch' 0"
		cset "name='O034 I168 Switch' 0"
		cset "name='O035 I169 Switch' 0"
		cset "name='O036 I012 Switch' 0"
		cset "name='O037 I013 Switch' 0"
		cset "name='DPTX_OUT_MUX' 0"
		cset "name='MTKAIF_DMIC Switch' Off"
	]
}

SectionDevice."Speaker" {
	Comment "Internal speakers"
	Value {
		PlaybackPCM "hw:${CardId},16"
		PlaybackChannels 2
		PlaybackPriority 100
	}
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='O072 I070 Switch' 1"
		cset "name='O073 I071 Switch' 1"
	]
	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='O072 I070 Switch' 0"
		cset "name='O073 I071 Switch' 0"
	]
}

SectionDevice."Headphones" {
	Comment "Headphone jack"
	Value {
		PlaybackPCM "hw:${CardId},17"
		PlaybackChannels 2
		PlaybackPriority 200
		JackControl "Headphone Jack"
	}
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='O048 I020 Switch' 1"
		cset "name='O049 I021 Switch' 1"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 1"
	]
	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='O048 I020 Switch' 0"
		cset "name='O049 I021 Switch' 0"
		cset "name='Stereo1 DAC MIXL DAC L1 Switch' 0"
		cset "name='Stereo1 DAC MIXR DAC R1 Switch' 0"
	]
}

SectionDevice."InternalMic" {
	Comment "Internal digital microphones"
	Value {
		CapturePCM "hw:${CardId},18"
		CaptureChannels 2
		CapturePriority 200
	}
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='MTKAIF_DMIC Switch' On"
		cset "name='O034 I168 Switch' 1"
		cset "name='O035 I169 Switch' 1"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH2"
	]
	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='O034 I168 Switch' 0"
		cset "name='O035 I169 Switch' 0"
		cset "name='MTKAIF_DMIC Switch' Off"
	]
}

SectionDevice."Mic" {
	Comment "Headset microphone"
	Value {
		CapturePCM "hw:${CardId},19"
		CaptureChannels 2
		CapturePriority 100
		JackControl "Headset Mic Jack"
	}
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='O036 I012 Switch' 1"
		cset "name='O037 I013 Switch' 1"
		cset "name='CBJ Boost Volume' 15"
		cset "name='RECMIX1L CBJ Switch' 1"
		cset "name='RECMIX1R CBJ Switch' 1"
		cset "name='Stereo1 ADC L1 Mux' 1"
		cset "name='Stereo1 ADC R1 Mux' 1"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
	]
	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='O036 I012 Switch' 0"
		cset "name='O037 I013 Switch' 0"
		cset "name='RECMIX1L CBJ Switch' 0"
		cset "name='RECMIX1R CBJ Switch' 0"
		cset "name='Stereo1 ADC L1 Mux' 0"
		cset "name='Stereo1 ADC R1 Mux' 0"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 0"
	]
}

SectionDevice."HDMI" {
	Comment "DisplayPort audio"
	Value {
		PlaybackPCM "hw:${CardId},5"
		PlaybackChannels 2
		PlaybackPriority 50
		JackControl "DP Jack"
	}
	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='DPTX_OUT_MUX' 1"
	]
	DisableSequence [
		cdev "hw:${CardId}"
		cset "name='DPTX_OUT_MUX' 0"
	]
}
